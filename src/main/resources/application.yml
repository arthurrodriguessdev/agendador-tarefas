spring:
  application:
    name: agendador-tarefas
  datasource:
    url: ${SPRING_DATASOURCE_URL_AGENDADOR}
    username: ${SPRING_DATASOURCE_USERNAME_AGENDADOR}
    password: ${SPRING_DATASOURCE_PASSWORD_AGENDADOR}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${PORTA_AGENDADOR}
usuario:
  url: ${USUARIO_URL:http://localhost:8080}